<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      最小引导页（bootstrap）。

      ── 它的唯一职责 ────────────────────────────────────────────────────
      让 Tauri 的注入脚本跑起来，从而建立 `window.__TAURI_INTERNALS__`，
      使 Compose 侧的 RustBridge 能通过 `Rust.ipc()` 调用那 60 个 Rust 命令。

      **这个页面没有界面。** 用户看到的一切都是 Compose 画的；
      承载它的 WebView 是 1×1、alpha=0 的隐形元素（见 ComposeMainActivity）。

      ── 为什么必须留着它 ────────────────────────────────────────────────
      `Rust.ipc()` 的实现是**按 webview id 查表**：
        // wry-0.57.0/src/android/binding.rs:412
        if let Some(ipc) = IPC.lock().unwrap().get(&webview_id) { ... }
      那张表只在 **Rust 创建 WebView 时**写入（wry/src/android/mod.rs:277）。
      没有 WebView 就没有 id，`Rust.ipc()` 会静默什么都不做。

      所以「彻底换成 Compose」的实际形态是：
        用户界面 100% Compose，WebView 退化成一个隐形 IPC 端点。

      ── 与旧 index.html 的区别 ──────────────────────────────────────────
      旧版加载的是完整 Vue 应用（几十个 chunk、几百 KB），
      职责是「渲染界面」。本文件只有几行，职责是「建立 IPC 环境」。

      ── 已验证的事实（2026-10-13 实测）────────────────────────────────
      `__TAURI_INTERNALS__` 由 Tauri 的注入脚本提供，**与加载什么页面无关**：
        - 注入脚本是 include_str! 嵌进 Rust 二进制的（不读磁盘）
        - 注入发生在创建 WebView 时，与 URL 无关
        - 实测 5 项注入函数全部存在：
            ipc / transformCallback / postMessage / runCallback / window.ipc.postMessage
      其中 window.ipc.postMessage 是 Java 侧 addJavascriptInterface 注入的
      原生桥 —— 页面脚本不可能伪造，是「环境真实可用」的强证据。

      详见 COMPOSE-PHASE5-PREREQ.md。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QookiX Launcher (bootstrap)</title>
    <style>
      /* 页面本身不可见 —— 真正渲染的是 Compose。 */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
    </style>
  </head>

  <body>
    <!--
      这里**故意不放任何 UI**。

      也不引任何外部脚本 —— 页面越简单越好：
        - 没有网络请求（离线可用）
        - 没有构建产物（不需要 vite）
        - 体积几乎为零（1 KB 以下）

      唯一的 JS 是一段自检：确认 Tauri 的注入确实生效了。
      它只写 console，不影响任何行为 —— 出问题时看 logcat 能立刻定位。
    -->

    <!--
      ── 皮肤 3D 预览（2026-10-15 加）─────────────────────────────────────
      旧 UI 用 skinview3d 做 3D 皮肤预览（旋转 / 动画 / 纤细模型切换），
      Compose 没有 3D 引擎。这里**复用本 WebView** 离屏渲染，
      再把像素读回 Kotlin 显示 —— 不新增进程，页面依然完全不可见。

      ⚠️ 脚本放在 `src/main/assets-components/skin3d/`，**不能放同目录** ——
      本文件所在目录是 vite 的 outDir 且 `emptyOutDir: true`，
      每次前端构建会整目录清空（Gradle 那边有同样的说明）。
      两个 assets 源目录在 APK 里合并成同一个 `assets/`，所以路径写成
      `skin3d/xxx.js` 即可。

      ⚠️ 回传路径不用 canvas.toDataURL：真机探针实测在不可见 WebView 里
      它返回空白（2D canvas 也一样），但 gl.readPixels 完全正常。
      详见 skin3d.js 顶部注释。
    -->
    <script src="skin3d/skinview3d.bundle.js"></script>
    <script src="skin3d/skin3d.js"></script>

    <script>
      (function () {
        function has(o, k) {
          try { return o && typeof o[k] !== "undefined"; } catch (e) { return false; }
        }

        function check() {
          var i = window.__TAURI_INTERNALS__;
          var report = {
            exists: !!i,
            ipc: has(i, "ipc"),
            transformCallback: has(i, "transformCallback"),
            postMessage: has(i, "postMessage"),
            runCallback: has(i, "runCallback"),
            wryIpc: has(window.ipc, "postMessage"),
            skin3d: has(window, "QkSkin3D"),
          };
          var ok = report.exists && report.ipc && report.transformCallback &&
                   report.postMessage && report.runCallback && report.wryIpc;

          // 只写 console。Android 侧由 RustWebChromeClient 转发到 logcat：
          //   adb logcat -s "Tauri/Console"
          console.log(
            "[qookix-bootstrap] " + (ok ? "IPC 环境就绪" : "IPC 环境缺失") +
            " " + JSON.stringify(report)
          );
          return ok;
        }

        // 注入脚本是 document-start 执行的，所以这里已经能拿到。
        // 万一时序有偏差（理论上不会），重试几次兜底。
        var tries = 0;
        (function attempt() {
          if (check() || ++tries >= 10) return;
          setTimeout(attempt, 100);
        })();
      })();
    </script>
  </body>
</html>
