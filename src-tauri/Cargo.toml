[workspace]

[package]
name = "qookix-launcher"
version = "0.2.1-beta1"
edition = "2021"
rust-version = "1.77"
description = "QookiX Launcher - Minecraft Launcher for Android and Desktop"
authors = ["Qookix Team"]
license = "MIT"

[lib]
name = "qookix_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "socks", "stream"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Compression
flate2 = "1"
tar = "0.4"
xz2 = "0.1"

# Cryptography
sha1 = "0.10"
sha2 = "0.10"

# Utilities
uuid = { version = "1", features = ["v3", "v4", "serde"] }
anyhow = "1"
thiserror = "1"
urlencoding = "2.1"



# Directories
dirs = "5.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Regex
regex = "1"

# Minecraft servers.dat (NBT) 解析
fastnbt = "2"

# Async utilities
futures = "0.3"

# Lazy static
lazy_static = "1.4"

# Zip archive
zip = { version = "0.6", features = ["deflate"] }

# Base64 (皮肤数据等)
base64 = "0.22"

# JNI for Android（Kotlin ↔ Rust 的唯一通道，见 commands::native_invoke）
jni = { version = "0.21", features = ["invocation"] }

# Dynamic library loading (for dlopen libjli.so on Android)
libloading = "0.8"

# CRC32 for native library integrity verification
crc32fast = "1.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal"] }
libc = "0.2"

[build-dependencies]

[dev-dependencies]
tempfile = "3"

[features]
default = []
# 发布构建瘦身：lto + 单编译单元 + 剥符号，把 195MB 的 libqookix_lib.so 砍到两位数 MB。
# 注意：**故意不加 panic="abort"** —— 启动器与游戏 JVM 同进程，abort 会让任何一次
# Rust panic 连游戏一起带走；也**不加 opt-level="z"** —— 保持默认 3，解压运行库等
# 一次性热路径不减速。体积不够再议。
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
