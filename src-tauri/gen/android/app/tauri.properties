# Android 包的 versionName / versionCode。
#
# 这个文件在仓库里原本是空的 → `app/build.gradle.kts` 退回默认值，
# 系统「应用信息」里版本号永远显示 1.0，所以这里补上。
#
# 编码规则：`major * 10000 + minor * 100 + patch`
#   1.2.3 → 10203    1.2.4 → 10204    1.3.0 → 10300    2.0.0 → 20000
# 只能增不能减（应用内更新靠覆盖安装）。历史发布包的 versionCode 是 gradle 的
# 兜底默认值 1，所以从 1 跳到 10203 对所有已装用户都是「升级」。
tauri.android.versionName=1.7.4
tauri.android.versionCode=10704