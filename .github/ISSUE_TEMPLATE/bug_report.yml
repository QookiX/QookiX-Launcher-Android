name: Bug 报告
description: 崩溃、黑屏、功能不工作、界面异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先看一眼 [KNOWN_ISSUES.md](https://github.com/QookiX/QookiX-Launcher-Android/blob/master/KNOWN_ISSUES.md)，
        有些问题（16 KB 页设备、CurseForge 需要自配 Key、陶瓦联机与系统 VPN 冲突）在那里已有说明。

        **没有日志的崩溃类问题基本无法定位** —— 下面是取日志的方法：
        `设置 → 关于 → 日志`，点「另存为」存成 txt；崩溃类问题再附上
        `实例 → 日志` 里的启动日志（同样支持另存为）。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 一句话说清现象，再写复现步骤
      placeholder: |
        1. 建一个 1.20.1 + Fabric 的实例
        2. 装 XX 模组
        3. 点「启动游戏」
        → 黑屏 30 秒后退回启动器
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的结果
      placeholder: 应该进入主菜单
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: 机型与 SoC
      placeholder: OnePlus 8 / 骁龙 865
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android 版本
      placeholder: Android 16（API 36）
    validations:
      required: true

  - type: dropdown
    id: renderer
    attributes:
      label: 渲染器
      options:
        - GL4ES（默认）
        - MobileGlues
        - Mesa（OSMesa + Zink + Turnip）
        - 不确定
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: 启动器版本 / 游戏版本 / 加载器
      placeholder: 启动器 1.8.0 · MC 1.20.1 · Fabric 0.16.5
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 直接粘贴关键几行即可（整份很大的话截取报错段落）；也可以说明已作为附件上传
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我看过 KNOWN_ISSUES.md，这个问题不在里面
          required: true
        - label: 我已经升级到最新 Release 试过
          required: true
