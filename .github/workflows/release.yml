name: Release

# 只在推送 v* 标签时触发：先跑闸门（单测 + 文件体量），再构建 arm64 / x86_64
# release APK 并发布 GitHub Release。
# 签名密钥经仓库 Secrets 注入（不出现任何密钥明文）：
#   QOOKIX_KEYSTORE_BASE64    keystore 文件的 Base64
#   QOOKIX_KEYSTORE_PASSWORD  keystore 密码
#   QOOKIX_KEY_ALIAS          key 别名
#   QOOKIX_KEY_PASSWORD       key 密码
# Secrets 缺失时退回 debug 签名（产物可安装，但与已发布包签名不同，需卸载重装）。

on:
  push:
    tags:
      - "v*"
  # 允许手动跑一次闸门（只是想验证 main 没坏时用，不会发版）
  workflow_dispatch:

permissions:
  contents: write # 发布 Release 需要

jobs:
  # ── 闸门：不通过就不打包 ────────────────────────────────────────────────
  #
  # 以前这个仓库是「CI 只打包、从不测试」，所以「依赖库显示已就绪、实际一个
  # 都没装」这类 bug 能活到发版。这里只做两件低成本的：
  #   1. `cargo test`：57 个单测（加载器解析、JVM 参数、路径拼装等纯函数）
  #   2. 文件体量棘轮：巨文件只许变小（见 scripts/check-file-size.mjs）
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 宿主目标（Linux）跑单测：安卓专属的代码用 cfg 隔开了，见各模块注释。
      # 这一步同时兜住「新增了安卓专属代码但漏了 cfg」这类只在宿主上暴露的错。
      - name: Rust 单测
        working-directory: src-tauri
        run: cargo test --lib --no-fail-fast

      - name: 文件体量闸门
        run: node scripts/check-file-size.mjs

  build:
    needs: gate
    runs-on: ubuntu-latest
    env:
      # 16KB 页对齐（Android 15+ 的 16KB 设备上 dlopen 会失败）。
      #
      # ⚠️ 不能只靠 `src-tauri/.cargo/config.toml` —— 那个文件被 .gitignore
      # 排除（里面是本机 NDK 绝对路径），CI / 新克隆里根本没有它。
      # 这里用「目标级 RUSTFLAGS」，只影响这两个安卓目标，不污染宿主的构建脚本。
      CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
      CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Node 只用于第 ⑦ 步生成发布说明（scripts/generate-release-notes.mjs）。
      # 前端资源构建已随 WebView 一起移除，不再需要 npm install。
      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Android SDK：compileSdk 36 需要对应 platform；runner 自带 cmdline-tools
      - name: 准备 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=sdkmanager
          yes | $SDKMGR --licenses > /dev/null || true
          $SDKMGR --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          # NDK：runner 未预装时补装（Rust 交叉编译与 gradle 的 ndkBuild 都要用）
          if [ -z "$(ls -A $ANDROID_HOME/ndk 2>/dev/null)" ]; then
            $SDKMGR --install "ndk;27.2.12479018" > /dev/null
          fi
          ls $ANDROID_HOME/ndk

      # NDK：取 runner 上最新版本，供 Rust 交叉编译的 clang wrapper 使用。
      # 仓库里不带 .cargo/config.toml（那里面有本机的绝对路径），
      # 所以链接器也由这里的环境变量提供（环境变量优先级高于配置文件）。
      - name: 定位 NDK
        run: |
          NDK=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n1)
          echo "NDK=$NDK" >> $GITHUB_ENV
          BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          {
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$BIN/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang"
            echo "CC_x86_64_linux_android=$BIN/x86_64-linux-android24-clang"
            echo "CXX_x86_64_linux_android=$BIN/x86_64-linux-android24-clang++"
            echo "AR_x86_64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$BIN/x86_64-linux-android24-clang"
          } >> $GITHUB_ENV

      - name: 安装 Rust (aarch64 / x86_64 linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ① Rust：release 交叉编译
      - name: 构建 Rust 库
        working-directory: src-tauri
        run: cargo build --release --target aarch64-linux-android --target x86_64-linux-android

      # ①b 校验 16KB 页对齐：只设了 RUSTFLAGS 不等于链接器真的照做了
      #（换 NDK / 换 linker / 上游 .so 混入都可能悄悄退回 4KB）。
      # PT_LOAD 的 Align 必须是 0x4000，否则安装到 16KB 设备上会 dlopen 失败。
      - name: 校验 16KB 页对齐
        run: |
          READELF=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          fail=0
          for f in src-tauri/target/aarch64-linux-android/release/libqookix_lib.so \
                   src-tauri/target/x86_64-linux-android/release/libqookix_lib.so; do
            echo "--- $f"
            $READELF -l "$f" | grep -E "^  LOAD" || true
            bad=$($READELF -l "$f" | awk '$1=="LOAD" && $NF!="0x4000" {print}')
            if [ -n "$bad" ]; then
              echo "::error file=$f::存在非 16KB 对齐的 LOAD 段（p_align != 0x4000）：$bad"
              fail=1
            fi
          done
          exit $fail

      # ①c Kotlin 侧闸门：JVM 单测真跑；仪器化冒烟测试只编译（runner 没设备）
      #
      # 仪器化测试要真机才能执行，这里只保证**它能编译** ——
      # 否则测试代码烂掉了没人知道；真机执行靠本地 connectedArm64DebugAndroidTest。
      - name: Kotlin 单测
        working-directory: android
        timeout-minutes: 20
        run: ./gradlew :app:testArm64DebugUnitTest --no-daemon --max-workers=2 --console=plain

      - name: 编译仪器化冒烟测试（不执行）
        working-directory: android
        timeout-minutes: 20
        run: ./gradlew :app:assembleArm64DebugAndroidTest --no-daemon --max-workers=2 --console=plain

      - name: 复制 .so 到 jniLibs
        working-directory: src-tauri
        run: |
          cp target/aarch64-linux-android/release/libqookix_lib.so \
             ../android/app/src/main/jniLibs/arm64-v8a/libqookix_lib.so
          cp target/x86_64-linux-android/release/libqookix_lib.so \
             ../android/app/src/main/jniLibs/x86_64/libqookix_lib.so

      # ② 签名密钥：Secrets 有则解出临时文件，无则 gradle 退回 debug 签名
      - name: 解出签名密钥
        env:
          QOOKIX_KEYSTORE_BASE64: ${{ secrets.QOOKIX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$QOOKIX_KEYSTORE_BASE64" ]; then
            KEYSTORE=$RUNNER_TEMP/qookix.keystore
            echo "$QOOKIX_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            {
              echo "QOOKIX_KEYSTORE=$KEYSTORE"
              echo "QOOKIX_KEYSTORE_PASSWORD=${{ secrets.QOOKIX_KEYSTORE_PASSWORD }}"
              echo "QOOKIX_KEY_ALIAS=${{ secrets.QOOKIX_KEY_ALIAS }}"
              echo "QOOKIX_KEY_PASSWORD=${{ secrets.QOOKIX_KEY_PASSWORD }}"
            } >> $GITHUB_ENV
            echo "使用 Secrets 提供的密钥签名"
          else
            # ⚠️ 2026-10-29（审计 A14）：**标签发布不允许退回 debug 签名**。
            #
            # 原来这里是「没密钥就退回 debug 签名」，然后照样发布 Release。
            # 后果很实在：已用正式签名安装的用户**装不上这个包**（签名不匹配），
            # 只能卸载 —— 而卸载会丢掉应用私有目录里的共享资源。
            #
            # 手动触发（workflow_dispatch）只是验证 main 没坏，允许用 debug 签名；
            # 但只要是**打标签发布**，缺密钥就必须失败，而不是发一个装不上的包。
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::标签发布必须提供正式签名密钥（QOOKIX_KEYSTORE_BASE64 / PASSWORD / KEY_ALIAS / KEY_PASSWORD），拒绝退回 debug 签名"
              exit 1
            fi
            echo "未配置签名密钥；本次为手动验证构建（非标签发布），使用 debug 签名"
          fi

      # ③ Gradle 打包（arm64 / x86_64 两个 flavor；universal 缺 armeabi-v7a、x86 的 Rust 库，不出）
      #
      # ⚠️ 2026-10-22 加 timeout-minutes ——
      # 上一版（v1.7.4 的 run 39639594331）在这里挂了 5 小时 49 分：
      #   compileArm64ReleaseArtProfile 抛 OutOfMemoryError
      #   → AAPT2 worker 死掉，Gradle 干等它的返回
      #   → packageArm64Release 既不报错也不推进
      #   → 直到 GitHub 的 6 小时作业上限才把整个 job 取消。
      #
      # 根因（OOM）已在 gradle.properties 里修掉
      # （-Xmx4096m / MaxMetaspaceSize=1024m / workers.max=2 / release 不跑 lint）。
      # 注意：`android.enableArtProfiles=false` 在 AGP 8 已删除、写了会直接构建失败，
      # 所以 Art Profile 不能关，只能给够堆。
      # 这个 timeout 是**兜底**：万一再挂，45 分钟就失败，
      # 而不是拖满 6 小时然后被"自动取消"（看不出是超时还是崩溃）。
      #
      # --max-workers=2 与 gradle.properties 的 org.gradle.workers.max=2 一致，
      # 显式写出来是为了不依赖 properties 是否被正确读取。
      # ③b 把 Java 21 运行时（27MB）内置进 APK。
      #
      # 为什么内置：运行时只有 GitHub Releases 一个源，国内实测单连接 55KB/s，
      # 几分钟后掉到 0.3KB/s（同一时刻同一条线路 Modrinth 47MB/s）——
      # 27MB 要爬十分钟以上。内置后「首次进游戏」不再联网，APK 48MB → 约 75MB。
      # 参考实现 Zalith Launcher 2 是四个 JRE 全内置（arm64 包 172MB），
      # 这里只放覆盖面最大的 21。
      #
      # 为什么不入库：27MB 二进制只为本地构建方便就进 git 不划算，
      # Actions 的出口带宽本来就快。大小必须与 java.rs 里 JRE_MIRRORS 登记的
      # 28675516 一致，对不上直接让构建失败（否则发出去的包缺运行时，用户又要等）。
      - name: 内置 Java 21 运行时
        run: |
          mkdir -p android/app/src/main/assets/jre/jre-21
          OUT=android/app/src/main/assets/jre/jre-21/jre21-android-arm64.tar.xz
          curl -fL --retry 3 --retry-delay 5 -o "$OUT" \
            https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/download_jre21/jre21-android-arm64.tar.xz
          ACTUAL=$(stat -c%s "$OUT")
          if [ "$ACTUAL" != "28675516" ]; then
            echo "内置运行时大小不符：$ACTUAL != 28675516" >&2
            exit 1
          fi
          ls -lh "$OUT"

      - name: Gradle 打包
        working-directory: android
        timeout-minutes: 45
        run: ./gradlew :app:assembleArm64Release :app:assembleX86_64Release --no-daemon --max-workers=2 --console=plain

      # ④ 产物改名：带版本号（多版本下载时不会认错）
      - name: 整理产物
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          cp android/app/build/outputs/apk/arm64/release/app-arm64-release.apk \
             "dist/QookiX-Launcher-Android-${TAG}-arm64.apk"
          cp android/app/build/outputs/apk/x86_64/release/app-x86_64-release.apk \
             "dist/QookiX-Launcher-Android-${TAG}-x86_64.apk"
          # 同时给出校验值，方便用户核对下载完整性
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      # ⑤ 发布说明：优先用 .github/release-notes/<tag>.md 完全自定义；
      #    没有则用 DEFAULT.md 模板（自动替换 {{VERSION}} / {{DATE}} / {{CHANGELOG}}）。
      #    想给某个版本写说明，就新增一个同名 md，无需改 workflow。
      - name: 准备发布说明
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            # 整篇自定义说明优先（个别版本想完全手写时用）
            cp "$NOTES" /tmp/release-body.md
            echo "使用自定义说明：$NOTES"
          else
            # 默认：CHANGELOG.md 里该 tag 的那一节 + DEFAULT.md 的安装/说明部分
            node scripts/generate-release-notes.mjs "$TAG" /tmp/release-body.md
          fi
          echo "--- 发布说明预览 ---"; cat /tmp/release-body.md

      # ⑥ 发布：APK + 校验文件挂到该 tag 的 GitHub Release
      #
      # tag 带 `-`（v0.2.1-beta1 / -rc1 …）一律标记成 **Pre-release**：
      # 预览版不能被当成正式版推给用户，GitHub 上也要一眼能看出来。
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
