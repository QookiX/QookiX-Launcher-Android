name: Release

# 只在推送 v* 标签时触发：构建 arm64 / x86_64 release APK 并发布 GitHub Release。
# 签名密钥经仓库 Secrets 注入（不出现任何密钥明文）：
#   QOOKIX_KEYSTORE_BASE64    keystore 文件的 Base64
#   QOOKIX_KEYSTORE_PASSWORD  keystore 密码
#   QOOKIX_KEY_ALIAS          key 别名
#   QOOKIX_KEY_PASSWORD       key 密码
# Secrets 缺失时退回 debug 签名（产物可安装，但与已发布包签名不同，需卸载重装）。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 发布 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 前端构建输出 + Gradle 构建目录
      PROJECT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Android SDK：compileSdk 36 需要对应 platform；runner 自带 cmdline-tools
      - name: 准备 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=sdkmanager
          yes | $SDKMGR --licenses > /dev/null || true
          $SDKMGR --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          # NDK：runner 未预装时补装（Rust 交叉编译与 gradle 的 ndkBuild 都要用）
          if [ -z "$(ls -A $ANDROID_HOME/ndk 2>/dev/null)" ]; then
            $SDKMGR --install "ndk;27.2.12479018" > /dev/null
          fi
          ls $ANDROID_HOME/ndk

      # NDK：取 runner 上最新版本，供 Rust 交叉编译的 clang wrapper 使用。
      # 仓库里不带 .cargo/config.toml（那里面有本机的绝对路径），
      # 所以链接器也由这里的环境变量提供（环境变量优先级高于配置文件）。
      - name: 定位 NDK
        run: |
          NDK=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n1)
          echo "NDK=$NDK" >> $GITHUB_ENV
          BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          {
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$BIN/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang"
            echo "CC_x86_64_linux_android=$BIN/x86_64-linux-android24-clang"
            echo "CXX_x86_64_linux_android=$BIN/x86_64-linux-android24-clang++"
            echo "AR_x86_64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$BIN/x86_64-linux-android24-clang"
          } >> $GITHUB_ENV

      - name: 安装 Rust (aarch64 / x86_64 linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ① 前端资源：只有 index.html + skin3d/*.js（Vue 已删除）
      #
      # ⚠️ 2026-10-18 修：原来是 `npm ci && npm run build`，但：
      #   - `npm ci` 要求 package.json 与 lock 严格一致，
      #     删掉 Vue 后 lock 里还有大量残留 → 直接失败
      #   - `npm run build` 这个脚本已经不存在了（改成 build:web-assets）
      # 现在用 `npm install`（会按 package.json 更新 lock）+
      # `build:web-assets`（纯拷贝，无打包器）。
      - name: 构建前端资源
        run: |
          npm install --no-audit --no-fund
          npm run build:web-assets

      # ② Rust：release 交叉编译（assets 会被 generate_context! 编进 .so，必须在 cargo 之前）
      - name: 构建 Rust 库
        working-directory: src-tauri
        run: cargo build --release --target aarch64-linux-android --target x86_64-linux-android

      - name: 复制 .so 到 jniLibs
        working-directory: src-tauri
        run: |
          cp target/aarch64-linux-android/release/libqookix_lib.so \
             gen/android/app/src/main/jniLibs/arm64-v8a/libqookix_lib.so
          cp target/x86_64-linux-android/release/libqookix_lib.so \
             gen/android/app/src/main/jniLibs/x86_64/libqookix_lib.so

      # ③ tauri 的两个自动生成文件（内容含本机绝对路径，故被 .gitignore 排除、不入库）：
      #    tauri.settings.gradle（include :tauri-android 与插件的 projectDir）
      #    app/tauri.build.gradle.kts（依赖 project(:tauri-android) 等）
      #    全新克隆里没有它们，必须按 cargo registry 里的真实路径现生成。
      - name: 生成 tauri gradle 桥接文件
        working-directory: src-tauri/gen/android
        run: |
          REG=$(ls -d $CARGO_HOME/registry/src/*/ | head -1)
          TAURI_DIR=$(ls -d ${REG}tauri-*/mobile/android | sort -V | tail -1)
          DIALOG_DIR=$(ls -d ${REG}tauri-plugin-dialog-*/android | sort -V | tail -1)
          OPENER_DIR=$(ls -d ${REG}tauri-plugin-opener-*/android | sort -V | tail -1)
          cat > tauri.settings.gradle <<EOF
          // THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          include ':tauri-android'
          project(':tauri-android').projectDir = new File("$TAURI_DIR")
          include ':tauri-plugin-dialog'
          project(':tauri-plugin-dialog').projectDir = new File("$DIALOG_DIR")
          include ':tauri-plugin-opener'
          project(':tauri-plugin-opener').projectDir = new File("$OPENER_DIR")
          EOF
          cat > app/tauri.build.gradle.kts <<EOF
          // THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          val implementation by configurations
          dependencies {
            implementation("androidx.lifecycle:lifecycle-process:2.10.0")
            implementation(project(":tauri-android"))
            implementation(project(":tauri-plugin-dialog"))
            implementation(project(":tauri-plugin-opener"))
          }
          EOF
          echo "--- tauri.settings.gradle ---"; cat tauri.settings.gradle
          echo "--- app/tauri.build.gradle.kts ---"; cat app/tauri.build.gradle.kts

      # ④ 签名密钥：Secrets 有则解出临时文件，无则 gradle 退回 debug 签名
      - name: 解出签名密钥
        env:
          QOOKIX_KEYSTORE_BASE64: ${{ secrets.QOOKIX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$QOOKIX_KEYSTORE_BASE64" ]; then
            KEYSTORE=$RUNNER_TEMP/qookix.keystore
            echo "$QOOKIX_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            {
              echo "QOOKIX_KEYSTORE=$KEYSTORE"
              echo "QOOKIX_KEYSTORE_PASSWORD=${{ secrets.QOOKIX_KEYSTORE_PASSWORD }}"
              echo "QOOKIX_KEY_ALIAS=${{ secrets.QOOKIX_KEY_ALIAS }}"
              echo "QOOKIX_KEY_PASSWORD=${{ secrets.QOOKIX_KEY_PASSWORD }}"
            } >> $GITHUB_ENV
            echo "使用 Secrets 提供的密钥签名"
          else
            echo "未配置 QOOKIX_KEYSTORE_BASE64，退回 debug 签名"
          fi

      # ⑤ Gradle 打包（arm64 / x86_64 两个 flavor；universal 缺 armeabi-v7a、x86 的 Rust 库，不出）
      - name: Gradle 打包
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:assembleArm64Release :app:assembleX86_64Release --no-daemon

      # ⑥ 产物改名：带版本号（多版本下载时不会认错）
      - name: 整理产物
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          cp src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk \
             "dist/QookiX-Launcher-Android-${TAG}-arm64.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/x86_64/release/app-x86_64-release.apk \
             "dist/QookiX-Launcher-Android-${TAG}-x86_64.apk"
          # 同时给出校验值，方便用户核对下载完整性
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      # ⑦ 发布说明：优先用 .github/release-notes/<tag>.md 完全自定义；
      #    没有则用 DEFAULT.md 模板（自动替换 {{VERSION}} / {{DATE}} / {{CHANGELOG}}）。
      #    想给某个版本写说明，就新增一个同名 md，无需改 workflow。
      - name: 准备发布说明
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            # 整篇自定义说明优先（个别版本想完全手写时用）
            cp "$NOTES" /tmp/release-body.md
            echo "使用自定义说明：$NOTES"
          else
            # 默认：CHANGELOG.md 里该 tag 的那一节 + DEFAULT.md 的安装/说明部分
            node scripts/generate-release-notes.mjs "$TAG" /tmp/release-body.md
          fi
          echo "--- 发布说明预览 ---"; cat /tmp/release-body.md

      # ⑧ 发布：APK + 校验文件挂到该 tag 的 GitHub Release
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-body.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

