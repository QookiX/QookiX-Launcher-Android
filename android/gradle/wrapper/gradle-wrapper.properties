#Tue May 10 19:22:52 CST 2022

distributionBase=GRADLE_USER_HOME
# 2026-11-08：改指向 GitHub 上的官方发行包镜像。
# 原因：CI（GitHub runner）连续三次在 services.gradle.org 上读超时，
# "Downloading ... gradle-8.14.3-bin.zip failed: timeout"，导致构建直接失败；
# 而 runner 访问 github.com 本来就是通的（见 gradle/gradle-distributions 仓库）。
distributionUrl=https\://github.com/gradle/gradle-distributions/releases/download/v8.14.3/gradle-8.14.3-bin.zip
distributionPath=wrapper/dists
zipStorePath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
